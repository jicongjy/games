<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>차려내라! 한 상 카드 시안</title>
<style>
*{box-sizing:border-box;margin:0}
body{background:#E9E7E2;font-family:"Pretendard","Noto Sans KR","Noto Sans CJK KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;padding:40px;display:flex;justify-content:center}
.grid{display:grid;grid-template-columns:repeat(3,260px);gap:28px}
.card{width:260px;height:340px;border-radius:18px;padding:20px 18px 16px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 2px 0 rgba(0,0,0,.08);color:#1a1a1a}
.t{font-weight:900;font-size:30px;line-height:1.1;text-align:center;letter-spacing:-.02em;min-height:66px;display:flex;align-items:center;justify-content:center}
svg{width:170px;height:170px;align-self:center}
.f{display:flex;justify-content:space-between;align-items:flex-end;font-weight:800}
.f .c{font-size:14px;opacity:.85}
.f .n{font-size:40px;line-height:1}
.light{color:#fff}
</style></head><body><div class="grid">

<div class="card" style="background:#A5CF4A"><div class="t">데치기</div>
<svg viewBox="0 0 200 200"><path d="M100 18C150 58 150 140 100 182C50 140 50 58 100 18Z" fill="#1F5A2A"/><path d="M62 120C30 100 22 62 40 40C70 54 80 90 62 120Z" fill="#2F7A3A"/><path d="M138 120C170 100 178 62 160 40C130 54 120 90 138 120Z" fill="#2F7A3A"/><path d="M100 40V170" stroke="#A5CF4A" stroke-width="6" stroke-linecap="round"/></svg>
<div class="f"><span class="c">밑반찬</span><span class="n">4</span></div></div>

<div class="card" style="background:#F28C28"><div class="t">한소끔<br>끓이기</div>
<svg viewBox="0 0 200 200"><circle cx="70" cy="34" r="12" fill="#FFF1DC"/><circle cx="104" cy="22" r="9" fill="#FFF1DC"/><circle cx="134" cy="38" r="12" fill="#FFF1DC"/><rect x="30" y="72" width="140" height="16" rx="8" fill="#5A2A10"/><path d="M42 92H158V130C158 160 136 182 100 182C64 182 42 160 42 130Z" fill="#5A2A10"/><circle cx="26" cy="108" r="10" fill="#5A2A10"/><circle cx="174" cy="108" r="10" fill="#5A2A10"/></svg>
<div class="f"><span class="c">국·탕</span><span class="n">6</span></div></div>

<div class="card light" style="background:#2F5FD0"><div class="t">뒤집기</div>
<svg viewBox="0 0 200 200"><polygon points="146,100 192,64 192,136" fill="#FFF"/><ellipse cx="90" cy="100" rx="64" ry="40" fill="#FFF"/><circle cx="58" cy="90" r="6" fill="#2F5FD0"/><path d="M96 70Q112 100 96 130M118 74Q132 100 118 126" stroke="#2F5FD0" stroke-width="6" fill="none" stroke-linecap="round"/></svg>
<div class="f"><span class="c">생선구이</span><span class="n">8</span></div></div>

<div class="card light" style="background:#E0402F"><div class="t">센 불에<br>볶기</div>
<svg viewBox="0 0 200 200"><path d="M100 14C112 56 158 76 152 132C147 168 124 188 100 188C76 188 53 168 48 132C44 102 68 92 76 62C88 74 94 48 100 14Z" fill="#FFD23F"/><path d="M100 98C108 120 128 128 126 152C124 168 112 176 100 176C88 176 76 168 74 152C72 132 94 124 100 98Z" fill="#FFF1DC"/></svg>
<div class="f"><span class="c">불고기</span><span class="n">8</span></div></div>

<div class="card" style="background:#F2A7C0"><div class="t">튀기기</div>
<svg viewBox="0 0 200 200"><rect x="30" y="30" width="140" height="140" rx="34" fill="#8A4B1F"/><rect x="52" y="52" width="96" height="96" rx="22" fill="none" stroke="#F5D9A8" stroke-width="5"/><circle cx="100" cy="100" r="14" fill="#F5D9A8"/><circle cx="72" cy="72" r="6" fill="#F5D9A8"/><circle cx="128" cy="72" r="6" fill="#F5D9A8"/><circle cx="72" cy="128" r="6" fill="#F5D9A8"/><circle cx="128" cy="128" r="6" fill="#F5D9A8"/></svg>
<div class="f"><span class="c">후식</span><span class="n">7</span></div></div>

<div class="card" style="background:#F1EDE6"><div class="t">단골 예약</div>
<svg viewBox="0 0 200 200"><polygon points="100,8 118,44 152,24 150,64 190,66 166,98 198,124 158,134 168,174 130,162 116,196 100,164 84,196 70,162 32,174 42,134 2,124 34,98 10,66 50,64 48,24 82,44" fill="#F28C28"/><text x="100" y="112" text-anchor="middle" font-size="34" font-weight="900" fill="#FFF" font-family="inherit">국·탕</text></svg>
<div class="f"><span class="c" style="font-size:12px;font-weight:700">"뜨끈한 국물, 오늘 책임져 주세요"</span></div></div>

</div></body></html>
