<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">

<script>
// 세로로 든 폰은 화면을 눕혀서 보여 준다(style.css의 html[data-rot="1"]).
// 글자를 칠 때 키보드가 올라와 화면 높이가 줄어도 "가로 모드"로 오해하지 않도록,
// 화면 크기가 아니라 기기를 든 방향(screen.orientation)으로 판정하고, 글자를 치는 동안은 크기를 고정한다.
(function () {
  var d = document.documentElement, last = null, timer = null;
  function typing() { var a = document.activeElement; return !!a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA'); }
  function devicePortrait() {
    var t = window.screen && screen.orientation && screen.orientation.type;
    if (t) return t.indexOf('portrait') === 0;
    if (typeof window.orientation === 'number') return window.orientation === 0 || window.orientation === 180;
    return null;
  }
  function sync() {
    var t = typing(), p = devicePortrait();
    if (p === null) p = (t && last !== null) ? last : window.innerHeight > window.innerWidth;
    last = p;
    d.setAttribute('data-rot', p && Math.min(screen.width, screen.height) <= 1000 ? '1' : '0');
    if (!t) { d.style.setProperty('--svh', window.innerHeight + 'px'); d.style.setProperty('--svw', window.innerWidth + 'px'); }
  }
  function later() { clearTimeout(timer); timer = setTimeout(sync, 350); }
  window.addEventListener('resize', sync);
  window.addEventListener('orientationchange', later);
  document.addEventListener('focusout', later);
  if (window.screen && screen.orientation && screen.orientation.addEventListener) screen.orientation.addEventListener('change', later);
  sync();
})();
</script>
