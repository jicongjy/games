<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>빙판 마을의 배달부</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cstyle%3Epath{stroke:%23111}@media(prefers-color-scheme:dark){path{stroke:%23fff}}%3C/style%3E%3Cg fill='none' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M16 3v26M16 8.5l-3.6-3.6M16 8.5l3.6-3.6M16 23.5l-3.6 3.6M16 23.5l3.6 3.6'/%3E%3Cpath d='M16 3v26M16 8.5l-3.6-3.6M16 8.5l3.6-3.6M16 23.5l-3.6 3.6M16 23.5l3.6 3.6' transform='rotate(60 16 16)'/%3E%3Cpath d='M16 3v26M16 8.5l-3.6-3.6M16 8.5l3.6-3.6M16 23.5l-3.6 3.6M16 23.5l3.6 3.6' transform='rotate(120 16 16)'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--ink:#111;--paper:#fff;--panel:#ebebeb;--mid:#bdbdbd;--accent:#ff3b1f;
  --mono:"DM Mono",ui-monospace,Menlo,monospace;
  --sans:"Pretendard Variable","Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans)}
body{min-height:100vh;display:flex;justify-content:center}
#app{width:960px;max-width:100%;padding:36px 24px 150px;position:relative}
canvas{image-rendering:pixelated;display:block}
.screen{display:none}.screen.on{display:block}
h1{font-family:var(--sans);font-weight:700;letter-spacing:-.02em;font-size:44px;line-height:1.2;margin:0;text-align:center}
h2{font-family:var(--sans);font-weight:700;letter-spacing:-.02em;font-size:30px;margin:0;text-align:center}
.over{font-family:var(--sans);font-size:18px;text-align:center;margin:0 0 4px}
.sub{font-family:var(--sans);font-size:19px;text-align:center;margin:6px 0 0;color:#333}
.pill{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:13px;background:var(--paper);
  border:1px solid var(--ink);border-radius:999px;padding:5px 12px;white-space:nowrap}
button.pill{cursor:pointer;color:var(--ink)}
button.pill:hover,.pill.hot{background:var(--ink);color:var(--paper)}
.pill.accent{background:var(--accent);border-color:var(--accent);color:#fff}
.keys{font-family:var(--mono);font-size:12px;color:#555;text-align:center;margin-top:18px}
.row{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}

/* title */
#demoWrap{display:flex;justify-content:center;margin:28px 0 22px}
#demo{border:3px solid var(--ink);background:var(--paper);max-width:100%}
#press{animation:blink 1.1s steps(2,start) infinite}
@keyframes blink{50%{opacity:.15}}

#proWrap{display:flex;justify-content:center;margin-top:8px}
#pro{border:3px solid var(--ink);background:var(--paper);max-width:100%}
#proText{font-size:20px;line-height:1.7;text-align:center;white-space:pre-line;min-height:76px;margin:24px 0 14px}
#coach{display:none;align-items:center;gap:14px;border:3px solid var(--ink);padding:10px 16px 10px 10px;margin:0 auto 14px;width:fit-content;max-width:100%;font-size:17px}
#coach.on{display:flex}
#coachFace{background:var(--panel);padding:4px;flex:none}
/* town */
#s-town{position:relative}
#tools{position:absolute;right:0;top:0;display:flex;gap:10px}
.tool{display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;cursor:pointer;font-family:var(--sans);font-size:11px;color:#555;padding:0;position:relative}
.tool .ic{width:46px;height:46px;border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;background:var(--paper)}
.tool:hover .ic,.tool.hot .ic{background:var(--panel)}
.tool:hover::after{content:attr(data-tip);position:absolute;top:100%;margin-top:5px;right:0;white-space:nowrap;background:var(--ink);color:#fff;font-size:11px;padding:3px 8px;z-index:5}
.pill.big{font-family:var(--sans);font-size:16px;font-weight:600;padding:11px 26px}
#prog{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:12px;font-size:14px;color:#333}
#pips{display:flex;gap:4px}#pips i{width:12px;height:12px;border:2px solid var(--ink);display:block}#pips i.on{background:var(--accent);border-color:var(--accent)}
#cap{display:flex;align-items:center;gap:14px;background:var(--ink);color:#fff;width:918px;max-width:100%;margin:0 auto;padding:12px 16px;min-height:64px}
#capFace{background:#fff;padding:3px;flex:none;display:flex}
#capBody{flex:1;display:flex;flex-direction:column;gap:3px}
#capText{font-size:16px;line-height:1.5}
#capHint{font-size:12px;color:#bdbdbd}
#capBtn{display:none;flex:none;font-family:var(--sans);font-size:14px;font-weight:600;background:var(--accent);border-color:var(--accent);color:#fff;padding:8px 16px}
#mapWrap{display:flex;justify-content:center;margin:12px 0 0}
#map{border:3px solid var(--ink);background:var(--paper);max-width:100%}
h3{font-family:var(--mono);font-size:13px;font-weight:500;color:#555;margin:30px 0 0;border-bottom:1px solid var(--ink);padding-bottom:6px}
#cards{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;margin:16px 0 0}
.card{background:var(--panel);padding:22px 8px 14px;display:flex;flex-direction:column;align-items:center;gap:12px;
  cursor:pointer;outline:3px solid transparent;outline-offset:-3px;position:relative;min-height:190px}
.card.sel{outline-color:var(--ink)}
.card.sel::after{content:"";position:absolute;right:8px;top:8px;width:10px;height:10px;background:var(--accent)}
.card .meta{font-family:var(--mono);font-size:11px;color:#555;min-height:14px}
.card.locked{cursor:default}.card.locked .pill{border-color:var(--mid);color:#888}
.card .best{color:var(--accent)}

/* customize */
#customWrap{display:grid;grid-template-columns:300px 1fr;gap:36px;margin-top:36px;align-items:start}
#facePanel{background:var(--panel);height:340px;display:flex;align-items:center;justify-content:center}
.opt{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--panel);cursor:pointer}
.opt.sel{background:var(--panel)}
.opt .lab{font-family:var(--mono);font-size:12px;width:56px;color:#555}
.opt .val{flex:1;text-align:center;font-size:16px}
.opt .arr{font-family:var(--mono);cursor:pointer;padding:2px 8px;user-select:none}
.opt .cnt{font-family:var(--mono);font-size:11px;color:#888;width:44px;text-align:right}
#nameInput{flex:1;font:inherit;font-size:16px;border:0;border-bottom:1px solid var(--ink);background:transparent;padding:4px 2px;outline:0;text-align:center}

/* play */
#hud{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
#boardWrap{display:flex;justify-content:center}
#board{border:3px solid var(--ink);background:var(--paper)}
#clearBar{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:16px}
#acts{margin-top:16px}#acts.off{display:none}
.act{font-family:var(--sans);font-size:14px;padding:8px 16px;position:relative}
.act:disabled{opacity:.35;cursor:default;background:var(--paper);color:var(--ink)}
.act:hover::after{content:attr(data-tip);position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:5px;white-space:nowrap;background:var(--ink);color:#fff;font-size:11px;padding:3px 8px;z-index:5}
.act.pulse{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent)}
#board{cursor:pointer}
#toast{font-family:var(--sans);font-size:14px;position:fixed;left:50%;top:22px;transform:translateX(-50%);z-index:30;display:none}

/* dialogue */
#dlg{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);width:820px;max-width:calc(100% - 32px);
  background:var(--paper);border:3px solid var(--ink);padding:18px 20px;display:none;gap:20px;align-items:center;z-index:20;cursor:pointer}
#dlg.on{display:flex}
#dlgFace{display:flex;gap:6px;background:var(--panel);padding:10px;flex:none}
#dlgBody{flex:1;min-width:0}
#dlgName{margin-bottom:8px}
#dlgText{font-size:18px;line-height:1.65;white-space:pre-line;font-family:var(--sans)}
#dlgText.narr{font-family:var(--sans)}
#dlgNext{font-family:var(--sans);font-size:12px;color:#777;margin-top:8px;text-align:right}
#veil{position:fixed;inset:0;background:rgba(255,255,255,.72);display:none;z-index:10}
#veil.on{display:block}

#modal{position:fixed;inset:0;background:rgba(255,255,255,.86);z-index:25;display:none;align-items:center;justify-content:center;padding:20px}
#modal.on{display:flex}
#modalIn{width:520px;max-width:100%;background:var(--paper);border:3px solid var(--ink);padding:26px 26px 24px;display:flex;flex-direction:column;gap:20px}
#mTop{display:flex;align-items:center;gap:18px}#mStamp canvas{width:96px;height:96px}
#mKick{font-size:13px;color:var(--accent);font-weight:600}#mTitle{font-size:26px;font-weight:700;letter-spacing:-.02em;margin-top:2px}
#mStory{display:flex;gap:14px;align-items:flex-start;background:var(--panel);padding:14px}#mFace{flex:none;display:flex;gap:4px}
#mLine{font-size:16px;line-height:1.6;margin-top:8px}#mNote{font-size:13px;color:#555;margin-top:4px}
#mGift{display:flex;align-items:center;gap:14px}#mWear{flex:none;background:var(--panel);padding:6px;display:flex}
#mGiftK{font-size:12px;color:#555}#mGiftN{font-size:17px;font-weight:600;margin-top:2px}
#mUse{background:var(--paper)}
#bookClose{position:absolute;right:0;top:0;font-family:var(--sans);font-size:14px;padding:8px 16px}
#bookIn{position:relative}
/* notebook */
#book{position:fixed;inset:0;background:var(--paper);z-index:15;display:none;overflow:auto;padding:36px 24px}
#book.on{display:block}
#bookIn{width:912px;max-width:100%;margin:0 auto}
.quest{display:grid;grid-template-columns:72px 1fr auto;gap:18px;align-items:center;padding:14px 0;border-bottom:1px solid var(--panel)}
.quest .qt{font-family:var(--sans);font-weight:600;font-size:19px}
.quest .qd{font-size:14px;color:#555;margin-top:2px}
.stamp{width:64px;height:64px}
</style>
</head>
<body>
<div id="app">

  <section id="s-title" class="screen">
    <p class="over">서리골 우체국</p>
    <h1>빙판 마을의 배달부</h1>
    <p class="sub">한번 미끄러지면, 부딪혀야 멈춘다</p>
    <div id="demoWrap"><canvas id="demo"></canvas></div>
    <div class="row">
      <button class="pill accent" id="btnStart"><span id="press">▸</span> <span id="startLab">시작하기</span></button>
      <button class="pill" id="btnReset" style="display:none">처음부터 다시</button>
    </div>
  </section>

  <section id="s-pro" class="screen">
    <div id="proWrap"><canvas id="pro"></canvas></div>
    <p id="proText"></p>
    <div class="row"><button class="pill big" id="btnPro">다음 ▸</button></div>
  </section>

  <section id="s-custom" class="screen">
    <p class="over">출근 준비</p>
    <h2>배달부 꾸미기</h2>
    <div id="customWrap">
      <div id="facePanel"><canvas id="faceBig" width="256" height="256" style="width:256px;height:256px"></canvas></div>
      <div id="opts"></div>
    </div>
    <div class="row" style="margin-top:14px"><button class="pill accent big" id="btnCustomDone">완료</button></div>
  </section>

  <section id="s-town" class="screen">
    <div id="tools">
      <button class="tool" id="btnBook" data-tip="배달 수첩 (Q)"><span class="ic" id="icBook"></span><span>수첩 <span id="stampCount"></span></span></button>
      <button class="tool" id="btnCustom" data-tip="배달부 꾸미기 (C)"><span class="ic" id="icMe"></span><span>꾸미기</span></button>
      <button class="tool" id="btnOver" data-tip="마을 전체 보기 (M)"><span class="ic" id="icMap"></span><span>지도</span></button>
    </div>
    <p class="over">큰 서리의 밤</p>
    <h2>서리골</h2>
    <div id="prog"><span id="pips"></span><span id="progText"></span></div>
    <div id="mapWrap"><canvas id="map"></canvas></div>
    <div id="cap"><span id="capFace"></span><span id="capBody"><span id="capText"></span><span id="capHint"></span></span><button class="pill" id="capBtn"></button></div>
  </section>

  <section id="s-play" class="screen">
    <div id="hud">
      <span class="pill" id="hudStage"></span>
      <span class="pill" id="hudMoves"></span>
    </div>
    <div id="coach"><span id="coachFace"></span><span id="coachText"></span></div>
    <div id="boardWrap"><canvas id="board"></canvas></div>
    <div id="clearBar"></div>
    <div class="row" id="acts">
      <button class="pill act" id="aUndo" data-tip="단축키 Z">↶ 한 수 물리기</button>
      <button class="pill act" id="aRe" data-tip="단축키 R">⟲ 처음부터</button>
      <button class="pill act" id="aTown" data-tip="단축키 Esc">마을로 나가기</button>
    </div>
  </section>
</div>

<div id="veil"></div>
<div id="dlg">
  <div id="dlgFace"></div>
  <div id="dlgBody">
    <div id="dlgName"></div>
    <div id="dlgText"></div>
    <div id="dlgNext">눌러서 계속 ▸</div>
  </div>
</div>
<div id="book"><div id="bookIn">
  <button class="pill" id="bookClose">수첩 덮기 ✕</button>
  <p class="over">서리골 우체국</p>
  <h2>배달 수첩</h2>
  <h3>주소록 · 두루 씨가 적어 둔 여덟 집. 소포를 전한 집은 다시 찾아갈 수 있습니다</h3>
  <div id="cards"></div>
  <h3>우표 · 두루 씨가 사십 년 동안 마을에서 겪은 일마다 자리를 만들어 두었습니다. 빈자리에는 두루 씨의 메모가 남아 있습니다</h3>
  <div id="quests"></div>
  <div class="row" style="margin-top:28px"><button class="pill big" id="bookClose2">수첩 덮기</button></div>
</div></div>
<div id="modal"><div id="modalIn">
  <div id="mTop"><span id="mStamp"></span><div><div id="mKick">새 우표를 받았습니다</div><div id="mTitle"></div></div></div>
  <div id="mStory"><span id="mFace"></span><div><span class="pill" id="mName"></span><div id="mLine"></div><div id="mNote"></div></div></div>
  <div id="mGift"><span id="mWear"></span><div><div id="mGiftK">함께 받은 소품</div><div id="mGiftN"></div></div></div>
  <div class="row"><button class="pill accent big" id="mOk">계속하기</button><button class="pill big" id="mUse">바로 써 보기</button></div>
</div></div>
<div id="toast" class="pill accent"></div>

<script>
"use strict";
/* ---------- 색과 픽셀 그림 ---------- */
const COL={'#':'#111','o':'#fff','r':'#ff3b1f','g':'#bdbdbd'};
const N=16;
function blank(){return Array.from({length:N},()=>Array(N).fill('.'))}
function put(g,rows,oy=0){rows.forEach((r,y)=>{for(let x=0;x<r.length&&x<N;x++){const c=r[x];if(c!=='.'&&y+oy<N)g[y+oy][x]=c}});return g}
function pts(g,list,c){list.forEach(([x,y])=>{if(x>=0&&x<N&&y>=0&&y<N)g[y][x]=c});return g}
function span(g,y,x1,x2,c){for(let x=x1;x<=x2;x++)pts(g,[[x,y]],c);return g}
function paint(ctx,g,x,y,s,mono){for(let j=0;j<N;j++)for(let i=0;i<N;i++){const c=g[j][i];if(c==='.')continue;ctx.fillStyle=mono||COL[c];ctx.fillRect(x+i*s,y+j*s,s,s)}}
function toCanvas(g,s,mono){const c=document.createElement('canvas');c.width=c.height=N*s;paint(c.getContext('2d'),g,0,0,s,mono);c.style.width=c.style.height=N*s+'px';return c}

const HEAD=["","","","....########....","...#oooooooo#...","..#oooooooooo#..","..#oooooooooo#..","..#oooooooooo#..","..#oooooooooo#..",
 "..#oooooooooo#..","..#oooooooooo#..","..#oooooooooo#..","..#oooooooooo#..","...#oooooooo#...","....########...."];
const HAIRS=[
 {n:'민머리',b:[]},
 {n:'짧은 머리',b:["","","....########....","...##########...","..############..","..###......###.."]},
 {n:'단발',b:["","","....########....","...##########...","..############..","..####....####..","..##........##..","..##........##..","..##........##..","..##........##..","..##........##..","..##........##.."]},
 {n:'곱슬',b:["","....#.##.##.#...","...##########...","..############..",".##############.",".###.#....#.###.",".##..........##."]},
 {n:'올림머리',b:["......####......","......####......","....########....","...##########...","..############..","..##........##.."]},
 {n:'삐침',b:["...#..#..#..#...","...##.##.##.##..","...###########..","..############..","..############..","..#.#.#.#.#..#.."]},
 {n:'양갈래',b:["","","....########....","...##########...","..############..","..###......###..","##............##","##............##","##............##",".#............#."]},
];
const EYES=[
 {n:'점',p:[[5,8],[10,8]]},
 {n:'긴 눈',p:[[5,7],[5,8],[10,7],[10,8]]},
 {n:'웃는 눈',p:[[4,8],[5,7],[6,8],[9,8],[10,7],[11,8]]},
 {n:'졸린 눈',p:[[4,8],[5,8],[6,8],[9,8],[10,8],[11,8]]},
 {n:'놀란 눈',p:[[5,7],[6,7],[5,8],[6,8],[9,7],[10,7],[9,8],[10,8]]},
];
const MOUTHS=[
 {n:'일자',p:[[7,11],[8,11]]},
 {n:'웃음',p:[[6,10],[7,11],[8,11],[9,10]]},
 {n:'오',p:[[7,10],[8,10],[7,11],[8,11]]},
 {n:'삐죽',p:[[6,11],[7,10],[8,10],[9,11]]},
 {n:'활짝',p:[[6,10],[7,10],[8,10],[9,10],[7,11],[8,11]]},
];
const ITEMS={
 none:{n:'없음',d(){}} ,
 scarf:{n:'다홍 목도리',d(g){span(g,14,3,12,'r');span(g,15,9,11,'r')}},
 blush:{n:'볼터치',d(g){pts(g,[[4,10],[11,10]],'r')}},
 glasses:{n:'안경',d(g){[4,9].forEach(x=>{span(g,7,x,x+2,'#');span(g,9,x,x+2,'#');pts(g,[[x,8],[x+2,8]],'#')});pts(g,[[7,8],[8,8]],'#')}},
 baguette:{n:'바게트',d(g){span(g,11,6,14,'r');pts(g,[[8,11],[11,11]],'#');span(g,10,7,14,'#');span(g,12,7,14,'#');pts(g,[[15,11]],'#')}},
 goggles:{n:'고글',d(g){span(g,7,3,12,'#');span(g,9,3,12,'#');span(g,8,3,12,'#');span(g,8,4,6,'r');span(g,8,9,11,'r')}},
 carrot:{n:'당근 코',d(g){pts(g,[[7,9],[8,9],[9,9],[10,9]],'r')}},
 cap:{n:'삐뚤어진 모자',d(g){span(g,0,8,12,'#');span(g,1,6,13,'#');span(g,2,4,13,'#');span(g,3,2,10,'#');pts(g,[[9,1],[10,1]],'r')}},
 loupe:{n:'돋보기 안경',d(g){span(g,6,9,11,'r');span(g,10,9,11,'r');pts(g,[[8,7],[8,8],[8,9],[12,7],[12,8],[12,9],[13,10],[14,11],[15,12]],'r')}},

 'ㅁ':[-1,0],'ㅇ':[1,0],'ㅈ':[0,-1],'ㄴ':[0,1]};
function parse(i){const L=LEVELS[i];const o={w:L[0].length,h:L.length,g:L.map(r=>r.split(''))};
 for(let y=0;y<o.h;y++)for(let x=0;x<o.w;x++){if(o.g[y][x]==='S'){o.sx=x;o.sy=y;o.g[y][x]='.'}if(o.g[y][x]==='G'){o.gx=x;o.gy=y;o.g[y][x]='.'}}return o}
function blocked(L,x,y){const c=L.g[y][x];return c==='#'||c==='o'}
function slide(L,x,y,dx,dy){let nx=x,ny=y;while(!blocked(L,nx+dx,ny+dy)){nx+=dx;ny+=dy}return[nx,ny]}
function solve(i,sx,sy){const L=parse(i);if(sx!=null){L.sx=sx;L.sy=sy}const key=(x,y)=>y*L.w+x;const prev=new Map([[key(L.sx,L.sy),null]]);const q=[[L.sx,L.sy]];
 while(q.length){const[x,y]=q.shift();if(x===L.gx&&y===L.gy){const path=[];let k=key(x,y);while(prev.get(k)){const p=prev.get(k);path.unshift(p.d);k=p.k}return path}
  for(const d of['ArrowLeft','ArrowRight','ArrowUp','ArrowDown']){const[nx,ny]=slide(L,x,y,...DIRS[d]);
   if((nx!==x||ny!==y)&&!prev.has(key(nx,ny))){prev.set(key(nx,ny),{k:key(x,y),d});q.push([nx,ny])}}}return null}

function loop(now){if(mode!=='play'&&mode!=='clear'&&mode!=='push'&&!(mode==='dlg'&&D&&D.back==='play')&&!(mode==='modal'&&MD&&MD.back==='play')){return}
 if(P.out){const o=P.out,t=(now-o.t)/560,far=Math.max(P.L.w,P.L.h)+1;P.dx=o.fx+o.d[0]*t*t*far;P.dy=o.fy+o.d[1]*t*t*far;draw(now);if(t>=1){P.out=null;o.cb();return}requestAnimationFrame(loop);return}
 if(P.anim){const a=P.anim;let t=Math.min(1,(now-a.t)/a.dur);const e=t*(2-t);P.dx=a.fx+(a.tx-a.fx)*e;P.dy=a.fy+(a.ty-a.fy)*e;if(t>=1){P.anim=null;P.dx=a.tx;P.dy=a.ty;arrive(a)}}
 draw(now);requestAnimationFrame(loop)}
function draw(now){drawBoard(cv,cx,P,now)}
function drawBoard(cv,cx,P,now){const L=P.L;cx.imageSmoothingEnabled=false;cx.fillStyle='#fff';cx.fillRect(0,0,cv.width,cv.height);
 for(let y=0;y<L.h;y++)for(let x=0;x<L.w;x++){if(L.g[y][x]==='#')continue;if((x*7+y*13)%5===0){cx.fillStyle='#e2e2e2';[[9,30],[12,27],[15,24],[33,15],[36,12]].forEach(([a,b])=>cx.fillRect(x*TS+a,y*TS+b,3,3))}}
 if(P.frost!=null&&P.frost<1)for(let y=0;y<L.h;y++)for(let x=0;x<L.w;x++){if(L.g[y][x]==='#')continue;if((x+((x*31+y*17)%7)*0.6)/(L.w+4)>P.frost){
  cx.fillStyle='#ebebeb';cx.fillRect(x*TS,y*TS,TS,TS);cx.fillStyle='#bdbdbd';[[9,12],[30,33],[36,9],[18,39]].forEach(([a,b])=>cx.fillRect(x*TS+a,y*TS+b,3,3))}}
 cx.fillStyle='#d2d2d2';P.marks.forEach(([x1,y1,x2,y2])=>{const ax=Math.min(x1,x2),ay=Math.min(y1,y2),w=Math.abs(x2-x1),h=Math.abs(y2-y1);
  if(w){cx.fillRect(ax*TS+24,ay*TS+15,w*TS,3);cx.fillRect(ax*TS+24,ay*TS+30,w*TS,3)}else{cx.fillRect(ax*TS+15,ay*TS+24,3,h*TS);cx.fillRect(ax*TS+30,ay*TS+24,3,h*TS)}});
 if(L.gx>=0){cx.globalAlpha=P.done?1:0.7+0.3*Math.sin(now/260);cx.drawImage(tiles.goal,L.gx*TS,L.gy*TS,TS,TS);cx.globalAlpha=1}
 for(let y=0;y<L.h;y++)for(let x=0;x<L.w;x++){const c=L.g[y][x];if(c==='#')cx.drawImage(P.demo&&y===0&&x>0&&x<L.w-1&&x%2?tiles.house:tiles.wall,x*TS,y*TS,TS,TS);
  else if(c==='o'){let t=obstType(P.k,x,y);if(t==='snowman'&&P.happy[x+','+y])t='snowmanHappy';cx.drawImage(tiles[t],x*TS,y*TS,TS,TS)}}
 let ox=0,oy=0;if(P.shake){const t=(now-P.shake.t)/140;if(t>=1)P.shake=null;else{const m=Math.sin(t*Math.PI)*6;ox=P.shake.dx*m;oy=P.shake.dy*m}}
 if(!P.demo&&mode==='play'&&!P.anim&&!P.done&&P.hist){const g=P.tut!=null&&P.tut<4?TUT[P.tut].key:null;
  for(const n of['ArrowLeft','ArrowRight','ArrowUp','ArrowDown']){const[dx,dy]=DIRS[n];if(blocked(L,P.x+dx,P.y+dy))continue;if(g&&(g==='z'||DIRS[g][0]!==dx||DIRS[g][1]!==dy))continue;
   const px=(P.x+.5+dx*.86)*TS,py=(P.y+.5+dy*.86)*TS;cx.fillStyle=g?COL.r:'#a8a8a8';for(let i=0;i<3;i++){const w=14-i*5,o=i*4-4;if(dx)cx.fillRect(Math.round(px+dx*o-2),Math.round(py-w/2),4,w);else cx.fillRect(Math.round(px-w/2),Math.round(py+dy*o-2),w,4)}}}
 if(P.me)cx.drawImage(P.me,Math.round(P.dx*TS+ox),Math.round(P.dy*TS+oy),TS,TS)}

/* ---------- 키 ---------- */
document.addEventListener('keydown',e=>{if(e.isComposing||e.metaKey||e.ctrlKey||e.altKey)return;const k=e.key,kl=k.length===1?k.toLowerCase():k;const ok=k==='Enter'||k===' ';
 const inName=document.activeElement&&document.activeElement.id==='nameInput';
 if(mode==='modal'){if(ok){e.preventDefault();modalOk()}return}
 if(mode==='dlg'){if(ok){e.preventDefault();nextLine()}return}
 if(mode==='title'){if(ok){e.preventDefault();start()}return}
 if(mode==='pro'){if(ok){e.preventDefault();proNext()}return}
 if(mode==='custom'){
  if(k==='ArrowDown'||k==='ArrowUp'){e.preventDefault();CU.row=(CU.row+(k==='ArrowDown'?1:4))%5;if(CU.row===0)$('nameInput').focus();else $('nameInput').blur();markRow();return}
  if(k==='Enter'){e.preventDefault();customDone();return}
  if(inName)return;if(k==='ArrowLeft'||k==='ArrowRight'){e.preventDefault();change(k==='ArrowLeft'?-1:1)}return}
 if(mode==='book'){if(k==='Escape'||kl==='q'||kl==='ㅂ'){e.preventDefault();book(false);return}
  const mv={ArrowLeft:-1,ArrowRight:1,ArrowUp:-5,ArrowDown:5}[k];if(mv){e.preventDefault();const n=T.sel+mv;if(n>=0&&n<10){T.sel=n;renderTown()}return}
  if(ok){e.preventDefault();pick()}return}
 if(mode==='town'){if(BR[k]){e.preventDefault();goDir(k);return}if(ok){e.preventDefault();if(CAPACT)CAPACT[1]();return}if(kl==='q'||kl==='ㅂ'){book(true);return}if(kl==='c'||kl==='ㅊ'){custom(false);return}if(kl==='m'||kl==='ㅡ'){overview();return}return}
 if(mode==='clear'){if(ok){e.preventDefault();afterClear()}return}
 if(mode==='play'){
  const dk=DIRS[k]?k:(DIRS[kl]?kl:null);if(dk){e.preventDefault();actMove(dk);return}
  if(kl==='z'||kl==='ㅋ'){actUndo();return}if(kl==='r'||kl==='ㄱ'){actRestart();return}
  if(k==='Escape'){town();return}}
});

 sec('지금 판');btn('정답 재생',()=>{if(mode!=='play'||P.done)return;clearInterval(auto);P.tut=null;coach();const path=solve(P.k,P.x,P.y)||[];auto=setInterval(()=>{if(mode!=='play'||!path.length){clearInterval(auto);return}if(!P.anim)move(path.shift())},60)});
 sec('진행 상태');btn('전부 배달 (보통)',()=>{clean();S.intro=true;S.best=MIN.map(m=>m+2);S.loc=7;save();town()});
 btn('빈집만 남기기',()=>{clean();S.intro=true;S.best=MIN.map((m,i)=>i<7?m+2:0);S.loc=PLAZA;save();town()});btn('우체국만 배달',()=>{clean();S.intro=true;S.best=MIN.map((m,i)=>i<1?m+2:0);S.loc=PLAZA;save();town()});
 btn('전부 최소 이동',()=>{clean();S.intro=true;S.best=MIN.slice();S.loc=7;save();town()});
 btn('우표와 소품 전부',()=>{clean();QUESTS.forEach(q=>S.quests[q.id]=1);ITEM_ORDER.forEach(k=>S.items[k]=1);S.pending=[];save();if(S.intro)town()});
 btn('처음 상태로',()=>{clean();S=fresh();save();title()});
 sec('장면 보기');btn('프롤로그',()=>{clean();prologue()});btn('빵집 이벤트',scene(EVENTS[1]));btn('가로등 이벤트',scene(EVENTS[3]));btn('제설기 이벤트',scene(EVENTS[5]));
 btn('기본 엔딩',scene(END_BASIC));btn('숨은 엔딩',scene(END_HIDDEN));
 sec('화면');btn('마을 지도',()=>{clean();S.intro=true;town()});btn('꾸미기',()=>{clean();custom(false)});btn('첫 화면',()=>{clean();title()})}
